<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        padding: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: grid;
        min-height: 100vh;
        place-items: center;
        text-align: center;
      }
      main {
        max-width: 520px;
        padding: 24px;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 0.5rem;
      }
      p {
        margin: 0.25rem 0 0.75rem;
        line-height: 1.5;
      }
      a {
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Estás sin conexión</h1>
      <p>Seguiremos funcionando, pero algunas secciones necesitan internet.</p>
      <p>Cuando vuelvas a conectarte actualiza la página para cargar los últimos datos.</p>
    </main>
  </body>
</html>
